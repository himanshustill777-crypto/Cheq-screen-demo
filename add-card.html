<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Add New Card</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.app{width:min(100vw,430px);height:100vh;overflow:hidden;position:relative;background:#fff}.shot{position:absolute;left:0;width:100%;height:auto;top:-3.8%}.back{position:absolute;z-index:5;left:2%;top:4.5%;width:14%;height:9%}.input{position:absolute;z-index:6;left:9.8%;top:22.2%;width:80.4%;height:6.4%;border:0;background:transparent;font-size:17px;outline:none;color:#222;letter-spacing:.2px;padding:0 12px}.continue{position:absolute;z-index:7;left:4.5%;right:4.5%;top:29.6%;height:6.7%;border:0;border-radius:10px;background:transparent;color:transparent}.continue.enabled{cursor:pointer}</style></head><body><main class="app"><img class="shot" src="./Screenshot_2026-10-27-12-08-32-479_com.cheq.retail.jpg" alt=""><a class="back" href="./home-preview.html" aria-label="Back"></a><input id="card" class="input" inputmode="numeric" autocomplete="cc-number" maxlength="19" aria-label="Credit Card Number"><button id="go" class="continue" disabled aria-label="Continue">Continue</button></main><script>const card=document.getElementById('card'),go=document.getElementById('go');card.addEventListener('input',()=>{let d=card.value.replace(/\D/g,'').slice(0,16);card.value=d.replace(/(.{4})/g,'$1 ').trim();go.disabled=d.length!==16;go.classList.toggle('enabled',d.length===16)});go.addEventListener('click',()=>{const d=card.value.replace(/\D/g,'');if(d.length!==16)return;let cards=JSON.parse(localStorage.getItem('cheq_cards')||'[]');cards.push({id:Date.now(),last4:d.slice(-4)});localStorage.setItem('cheq_cards',JSON.stringify(cards));location.href='./home-preview.html';});</script></body></html>
