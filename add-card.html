<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Add New Card</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif}body{display:flex;justify-content:center}.app{width:min(100vw,430px);height:100vh;overflow:hidden;position:relative;background:#fff}.screen{position:relative;width:100%;transform:translateY(-3.8vh)}.shot{display:block;width:100%;height:auto}.back{position:absolute;z-index:5;left:2%;top:5.6%;width:14%;height:6%;display:block}.input{position:absolute;z-index:6;left:17%;top:27.6%;width:73%;height:5.2%;border:0;background:#fff;font-size:18px;font-weight:600;outline:none;color:#222;letter-spacing:.3px;padding:0 4px;box-shadow:none}.continue{position:absolute;z-index:7;left:4.5%;right:4.5%;top:88.3%;height:5.3%;border:0;border-radius:28px;background:transparent;color:transparent}.continue.enabled{cursor:pointer;background:#2bc477;color:#fff;font-size:18px;font-weight:700}.input::placeholder{color:#bfc2c2;font-weight:500;letter-spacing:1px;opacity:1}</style></head><body><main class="app"><div class="screen"><img class="shot" src="./Screenshot_2026-10-27-12-08-32-479_com.cheq.retail.jpg" alt=""><a class="back" href="./home-preview.html" aria-label="Back"></a><input id="card" class="input" inputmode="numeric" autocomplete="cc-number" maxlength="19" aria-label="Credit Card Number" placeholder="XXXX XXXX XXXX XXXX"><button id="go" class="continue" disabled aria-label="Continue">Continue</button></div></main><script>const card=document.getElementById('card'),go=document.getElementById('go');card.addEventListener('input',()=>{let d=card.value.replace(/\D/g,'').slice(0,16);card.value=d.replace(/(.{4})/g,'$1 ').trim();go.disabled=d.length!==16;go.classList.toggle('enabled',d.length===16)});go.addEventListener('click',()=>{const d=card.value.replace(/\D/g,'');if(d.length!==16)return;let cards=JSON.parse(localStorage.getItem('cheq_cards')||'[]');cards.push({id:Date.now(),last4:d.slice(-4)});localStorage.setItem('cheq_cards',JSON.stringify(cards));location.href='./home-preview.html';});</script></body></html>
