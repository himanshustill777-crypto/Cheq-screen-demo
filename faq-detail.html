<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>FAQ Detail</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;position:relative;background:#fff}.shot{display:block;width:100%;height:auto}.back{position:absolute;z-index:5;left:1%;top:2%;width:15%;height:8%}.need{position:absolute;z-index:6;left:4%;right:4%;bottom:5%;height:7%;border:0;background:transparent}.dim{display:none;position:fixed;z-index:20;inset:0;background:rgba(0,0,0,.58)}.popup{display:none;position:fixed;z-index:21;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,430px);max-height:72vh;overflow:hidden;border-radius:22px 22px 0 0}.popup img{display:block;width:100%}.on{display:block}</style></head><body><main class="app"><img id="shot" class="shot"><a class="back" href="./tuition-help.html"></a><button id="need" class="need"></button><div id="dim" class="dim"></div><div id="popup" class="popup"><img src="./IMG-20261027-WA0042.jpg"></div></main><script>const n=Math.min(21,Math.max(1,Number(new URLSearchParams(location.search).get("n"))||1));document.getElementById("shot").src="./IMG-20261027-WA"+String(20+n).padStart(4,"0")+".jpg";const d=document.getElementById("dim"),p=document.getElementById("popup");document.getElementById("need").onclick=()=>{d.classList.add("on");p.classList.add("on")};d.onclick=()=>{d.classList.remove("on");p.classList.remove("on")};</script></body></html>
