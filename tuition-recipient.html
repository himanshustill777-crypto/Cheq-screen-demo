<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Recipient Details</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#171717}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;background:#fff}.ui{padding:12px 18px 100px}.top{display:flex;align-items:center;height:48px}.backBtn{border:0;background:#fff;font-size:32px;width:40px}.helpBtn{margin-left:auto;text-decoration:none;color:#111;border:2px solid #111;border-radius:50%;width:27px;height:27px;text-align:center;font-weight:700}.title{font-size:28px;margin:14px 0 28px}.mobileRow{height:60px;border:2px solid #d9d9d9;border-radius:10px;display:flex;align-items:center;padding:0 14px;gap:8px}.mobileRow input{flex:1;min-width:0;border:0;outline:0;font-size:17px}.contactReal{border:0;border-radius:8px;padding:10px 12px;background:#def7e8;color:#22b873;font-weight:700}.benefit{margin-top:30px;border:1px solid #ddd;border-radius:9px;overflow:hidden}.benefitHead{background:#f3f3f3;padding:12px 16px;font-weight:700}.benefitBody{padding:18px 16px;font-size:17px}.tTitle{font-size:21px;margin:30px 0 15px}.tList{border:1px solid #ddd;border-radius:9px;overflow:hidden}.tRow{height:82px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;padding:0 17px;text-align:left}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#def7e8;color:#20b875;font-weight:700;font-size:20px;margin-right:12px}.tm{flex:1}.tn{display:block;font-size:17px;font-weight:700}.ts{display:block;color:#777;margin-top:5px}.verified{color:#18aeca;background:#e8f9fc;padding:5px 7px;border-radius:7px;font-size:13px}.arrow{font-size:27px;color:#888;margin-left:8px}</style></head><body><main class="app"><div class="ui"><div class="top"><button id="backBtn" class="backBtn">‹</button><a class="helpBtn" href="./tuition-help.html">?</a></div><h1 class="title">Enter Recipient Details</h1><div class="mobileRow"><span>+91</span><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Recipient's Mobile Number"><button id="contactReal" class="contactReal">Contact</button></div><div class="benefit"><div class="benefitHead">Benefits</div><div class="benefitBody">🪙 &nbsp; Earn 1% CheQ Chips on every tuition fee payment</div></div><h2 class="tTitle">Verified Tutors on CheQ</h2><div id="tList" class="tList"></div></div></main><script>const tutors=["Aakash Tuition","Aakash Verma","Aakar Tuition","Aashirwad Tuition","Aastha Tuition","Abhay Tuition","Abhinav Tuition","Abhishek Tuition","Abhishek Kumar Tuition","Abhishek Singh Tuition","Achievers Tuition","Adarsh Tuition","Aditya Tuition","Ajay Tuition","Akash Tuition","Amit Tuition","Anand Tuition","Ankit Tuition","Ankur Tuition","Anmol Tuition"];const list=document.getElementById("tList");tutors.forEach((n,i)=>{const b=document.createElement("button");b.className="tRow";b.innerHTML='<span class="avatar">'+n[0]+'</span><span class="tm"><span class="tn">'+n+'</span><span class="ts">+91 ******'+String(3100+i*137).slice(-4)+'</span></span><span class="verified">✓ Verified</span><span class="arrow">›</span>';list.appendChild(b)});document.getElementById("backBtn").onclick=()=>history.back();const m=document.getElementById("mobile");m.oninput=()=>{m.value=m.value.replace(/\D/g,"").slice(0,10)};document.getElementById("contactReal").onclick=async()=>{try{if(navigator.contacts&&navigator.contacts.select){const a=await navigator.contacts.select(["tel"],{multiple:false});if(a&&a[0]&&a[0].tel&&a[0].tel[0])m.value=a[0].tel[0].replace(/\D/g,"").slice(-10);else m.focus()}else m.focus()}catch(e){m.focus()}};</script></body></html>
