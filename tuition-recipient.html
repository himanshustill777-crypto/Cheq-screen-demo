<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Recipient Details</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#171717}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;background:#fff}.ui{padding:12px 18px 100px}.top{display:flex;align-items:center;height:62px;padding-top:4px}.backBtn{border:0;background:#fff;font-size:30px;width:34px;padding:0;text-align:left;color:#222}.helpBtn{margin-left:auto;text-decoration:none;color:#111;border:2px solid #111;border-radius:50%;width:27px;height:27px;text-align:center;font-weight:700}.title{font-size:25px;font-weight:700;margin:28px 0 28px}.mobileRow{height:50px;display:flex;align-items:stretch;gap:10px}.mobileRow input{flex:1;min-width:0;border:2px solid #dedede;border-radius:9px;outline:0;font-size:16px;padding:0 16px}.contactReal{width:50px;border:0;border-radius:9px;background:#27bf76;color:#fff;font-size:0;font-weight:700;position:relative}.contactReal:after{content:"♙";font-size:27px;color:#fff}.benefit{margin-top:34px;border:0;border-radius:12px;overflow:hidden;background:#e9faff}.benefitHead{display:inline-block;background:#176f7d;color:#fff;padding:4px 12px;font-weight:700;border-radius:0 0 14px 0}.benefitBody{padding:15px 16px 17px;font-size:16px;line-height:2.7;background:linear-gradient(110deg,#e9faff,#f5fdff)}.tTitle{font-size:17px;font-weight:400;color:#555;margin:30px 0 13px}.tList{border:0;border-radius:0;overflow:hidden}.tRow{height:72px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;padding:0;text-align:left}.avatar{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;background:#e3faef;color:#174b50;font-weight:700;font-size:20px;margin-right:14px}.tm{flex:1}.tn{display:block;font-size:16px;font-weight:500}.ts{display:block;color:#777;margin-top:5px}.verified{font-size:0;background:transparent;padding:0;margin-left:7px}.verified:after{content:"♢";font-size:22px;color:#1aafbd}.arrow{font-size:26px;color:#888;margin-left:8px}</style></head><body><main class="app"><div class="ui"><div class="top"><button id="backBtn" class="backBtn">‹</button><a class="helpBtn" href="./tuition-help.html">?</a></div><h1 class="title">Enter Recipient Details</h1><div class="mobileRow"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Recipient’s Mobile Number"><button id="contactReal" class="contactReal">Contact</button></div><div style="font-size:14px;color:#aaa;margin-top:8px">Enter 10 digits mobile number</div><div class="benefit" id="adminBannerSlot"><div class="benefitHead">Benefits*</div><div class="benefitBody" id="adminBannerFallback"><b style="font-size:28px">0%</b>&nbsp;&nbsp; No additional bank surcharge<br><span style="font-size:25px">🪙</span>&nbsp;&nbsp; <b>Earn reward points</b> on your card<br><small style="color:#777">*Applicable on cards issued by: ● &nbsp; ● &nbsp; ✓ &nbsp; ▣</small></div><img id="adminBannerImage" alt="Benefits banner" style="display:none;width:100%;height:auto;object-fit:cover"></div><h2 class="tTitle">Verified Tutors on CheQ</h2><div id="tList" class="tList"></div></div></main><script>const tutors=[["Aakash Tuition","UPI","96****@pthdfc","83*****052"],["Future Academy","Bank","********8424","91*****622"],["Rise Up Academy","Bank","********1855","91*****877"],["The Career Zone","Bank","********7800","93*****563"],["Tee Aar Education","UPI","an****@oksbi","97*****042"]];const list=document.getElementById("tList");tutors.forEach((t)=>{const b=document.createElement("button");b.className="tRow";b.innerHTML='<span class="avatar">'+t[0][0]+'</span><span class="tm"><span class="tn">'+t[0]+' <span class="verified"></span></span><span class="ts"><b style="background:#f2f2f2;padding:2px 5px">'+t[1]+'</b>&nbsp; '+t[2]+' | +91 '+t[3]+'</span></span><span class="arrow">›</span>';list.appendChild(b)});document.getElementById("backBtn").onclick=()=>history.back();const m=document.getElementById("mobile");m.oninput=()=>{m.value=m.value.replace(/\D/g,"").slice(0,10)};document.getElementById("contactReal").onclick=async()=>{try{if(navigator.contacts&&navigator.contacts.select){const a=await navigator.contacts.select(["tel"],{multiple:false});if(a&&a[0]&&a[0].tel&&a[0].tel[0])m.value=a[0].tel[0].replace(/\D/g,"").slice(-10);else m.focus()}else m.focus()}catch(e){m.focus()}};const adminBanner=localStorage.getItem("cheq_tuition_banner");if(adminBanner){document.getElementById("adminBannerFallback").style.display="none";document.querySelector("#adminBannerSlot .benefitHead").style.display="none";const bi=document.getElementById("adminBannerImage");bi.src=adminBanner;bi.style.display="block";}</script></body></html>
