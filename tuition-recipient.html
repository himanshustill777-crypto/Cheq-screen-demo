<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Recipient Details</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#171717}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;background:#fff}.ui{padding:12px 18px 100px}.top{display:flex;align-items:center;height:62px;padding-top:4px}.backBtn{border:0;background:#fff;width:34px;height:34px;padding:0;position:relative;font-size:0;color:#222}.backBtn:before{content:"←";font-size:28px;font-weight:300;line-height:34px}.helpBtn{margin-left:auto;text-decoration:none;color:#111;border:2px solid #111;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-weight:700}.title{font-size:25px;font-weight:700;margin:28px 0 28px}.mobileRow{height:50px;display:flex;align-items:stretch;gap:10px}.mobileRow input{flex:1;min-width:0;border:2px solid #dedede;border-radius:9px;outline:0;font-size:16px;padding:0 16px}.contactReal{width:50px;border:0;border-radius:9px;background:#27bf76;color:#fff;font-size:0;font-weight:700;position:relative}.contactReal:after{content:"♙";font-size:27px;color:#fff}.benefit{margin-top:34px;border:0;border-radius:12px;overflow:hidden;background:#e9faff}.benefitHead{display:inline-block;background:#176f7d;color:#fff;padding:4px 12px;font-weight:700;border-radius:0 0 14px 0}.benefitBody{padding:15px 16px 17px;font-size:16px;line-height:2.7;background:linear-gradient(110deg,#e9faff,#f5fdff)}.tTitle{font-size:17px;font-weight:400;color:#555;margin:30px 0 13px}.tList{border:0;border-radius:0;overflow:hidden}.tRow{height:72px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;padding:0;text-align:left}.avatar{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;background:#e3faef;color:#174b50;font-weight:700;font-size:20px;margin-right:14px}.tm{flex:1}.tn{display:block;font-size:16px;font-weight:500}.ts{display:block;color:#777;margin-top:5px}.verified{display:inline-block;color:#18aeca;background:#e8f9fc;padding:4px 7px;border-radius:7px;font-size:13px;margin-left:7px}.verified:after{content:"✓ Verified";font-size:13px;color:#18aeca}.arrow{font-size:26px;color:#888;margin-left:8px} .dim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90}.sheet{display:none;position:fixed;z-index:91;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,430px);background:#fff;border-radius:22px 22px 0 0;padding:24px 22px 28px}.show{display:block}.sheetClose{position:absolute;right:18px;top:15px;border:0;background:#f1f1f1;border-radius:50%;width:34px;height:34px;font-size:24px}.sheet h2{margin:2px 0 20px}.detailLine{padding:10px 0;border-bottom:1px solid #eee}.proceed{width:100%;height:52px;border:0;border-radius:26px;background:#28bf76;color:#fff;font-size:18px;font-weight:700;margin-top:22px}</style></head><body><main class="app"><div class="ui"><div class="top"><button id="backBtn" class="backBtn">‹</button><a class="helpBtn" href="./tuition-help.html">?</a></div><h1 class="title">Enter Recipient Details</h1><div class="mobileRow"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Recipient’s Mobile Number"><button id="contactReal" class="contactReal">Contact</button></div><div style="font-size:14px;color:#aaa;margin-top:8px">Enter 10 digits mobile number</div><div class="benefit" id="adminBannerSlot"><div class="benefitHead">Benefits*</div><div class="benefitBody" id="adminBannerFallback"><b style="font-size:28px">0%</b>&nbsp;&nbsp; No additional bank surcharge<br><span style="font-size:25px">🪙</span>&nbsp;&nbsp; <b>Earn reward points</b> on your card<br><small style="color:#777">*Applicable on cards issued by: ● &nbsp; ● &nbsp; ✓ &nbsp; ▣</small></div><img id="adminBannerImage" alt="Benefits banner" style="display:none;width:100%;height:auto;object-fit:cover"></div><h2 class="tTitle">Verified Tutors on CheQ</h2><div id="tList" class="tList"></div></div></main><div id="tDim" class="dim"></div><section id="tSheet" class="sheet"><button id="tClose" class="sheetClose">×</button><h2>Tutor Details</h2><div id="tDetail"></div><button class="proceed">Proceed</button></section><script>const tutors=[["Aakash Tuition","UPI","96****@pthdfc","83*****052"],["Future Academy","Bank","********8424","91*****622"],["Rise Up Academy","Bank","********1855","91*****877"],["The Career Zone","Bank","********7800","93*****563"],["Tee Aar Education","UPI","an****@oksbi","97*****042"],["Abhay Tuition","Bank","********4521","98*****521"],["Abhinav Tuition","UPI","ab****@okaxis","97*****320"],["Abhishek Tuition","Bank","********5684","99*****684"],["Abhishek Kumar Tuition","UPI","ab****@oksbi","96*****196"],["Abhishek Singh Tuition","Bank","********8440","95*****440"],["Achievers Tuition","UPI","ac****@pthdfc","94*****018"],["Adarsh Tuition","Bank","********6507","93*****507"],["Aditya Tuition","UPI","ad****@okicici","92*****281"],["Ajay Tuition","Bank","********9004","91*****004"],["Akash Tuition","UPI","ak****@oksbi","98*****112"],["Amit Tuition","Bank","********7843","97*****843"],["Anand Tuition","UPI","an****@okaxis","96*****321"],["Ankit Tuition","Bank","********5066","95*****066"],["Ankur Tuition","UPI","an****@pthdfc","94*****754"],["Anmol Tuition","Bank","********1840","93*****840"]];const list=document.getElementById("tList");tutors.forEach((t)=>{const b=document.createElement("button");b.className="tRow";b.innerHTML='<span class="avatar">'+t[0][0]+'</span><span class="tm"><span class="tn">'+t[0]+' <span class="verified"></span></span><span class="ts"><b style="background:#f2f2f2;padding:2px 5px">'+t[1]+'</b>&nbsp; '+t[2]+' | +91 '+t[3]+'</span></span><span class="arrow">›</span>';b.onclick=()=>openTutor(t);list.appendChild(b)});const tDim=document.getElementById("tDim"),tSheet=document.getElementById("tSheet"),tDetail=document.getElementById("tDetail");function openTutor(t){tDetail.innerHTML='<div class="detailLine"><b>'+t[0]+'</b> <span class="verified"></span></div><div class="detailLine">'+t[1]+': '+t[2]+'</div><div class="detailLine">Mobile: +91 '+t[3]+'</div><div class="detailLine">PAN Details: ••••••••••</div><div class="detailLine">IFSC: •••••••••••</div>';tDim.classList.add("show");tSheet.classList.add("show")}function closeTutor(){tDim.classList.remove("show");tSheet.classList.remove("show")}tDim.onclick=closeTutor;document.getElementById("tClose").onclick=closeTutor;document.getElementById("backBtn").onclick=()=>history.back();const m=document.getElementById("mobile");m.oninput=()=>{m.value=m.value.replace(/\D/g,"").slice(0,10)};document.getElementById("contactReal").onclick=async()=>{try{if(navigator.contacts&&navigator.contacts.select){const a=await navigator.contacts.select(["tel"],{multiple:false});if(a&&a[0]&&a[0].tel&&a[0].tel[0])m.value=a[0].tel[0].replace(/\D/g,"").slice(-10);else m.focus()}else m.focus()}catch(e){m.focus()}};const adminBanner=localStorage.getItem("cheq_tuition_banner");if(adminBanner){document.getElementById("adminBannerFallback").style.display="none";document.querySelector("#adminBannerSlot .benefitHead").style.display="none";const bi=document.getElementById("adminBannerImage");bi.src=adminBanner;bi.style.display="block";}</script></body></html>
