<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Recipient Details</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#171717}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;background:#fff}.ui{padding:12px 18px 100px}.top{display:flex;align-items:center;height:62px;padding-top:4px}.backBtn{border:0;background:#fff;width:34px;height:34px;padding:0;position:relative;font-size:0;color:#222}.backBtn:before{content:"←";font-size:28px;font-weight:300;line-height:34px}.helpBtn{margin-left:auto;text-decoration:none;color:#111;border:2px solid #111;border-radius:50%;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;font-weight:700}.title{font-size:25px;font-weight:700;margin:28px 0 28px}.mobileRow{height:50px;display:flex;align-items:stretch;gap:10px}.mobileRow input{flex:1;min-width:0;border:2px solid #dedede;border-radius:9px;outline:0;font-size:16px;padding:0 16px}.contactReal{width:50px;border:0;border-radius:9px;background:#27bf76;color:#fff;font-size:0;font-weight:700;position:relative}.contactReal:after{content:"♙";font-size:27px;color:#fff}.benefit{margin-top:34px;border:0;border-radius:12px;overflow:hidden;background:#e9faff}.benefitHead{display:inline-block;background:#176f7d;color:#fff;padding:4px 12px;font-weight:700;border-radius:0 0 14px 0}.benefitBody{padding:15px 16px 17px;font-size:16px;line-height:2.7;background:linear-gradient(110deg,#e9faff,#f5fdff)}.tTitle{font-size:17px;font-weight:400;color:#555;margin:30px 0 13px}.tList{border:0;border-radius:0;overflow:hidden}.tRow{height:72px;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;align-items:center;padding:0;text-align:left}.avatar{width:48px;height:48px;border-radius:9px;display:grid;place-items:center;background:#e3faef >Earn reward points</b> on your card<br><small style="color:#777">*Applicable on cards issued by: ● &nbsp; ● &nbsp; ✓ &nbsp; ▣</small></div><img id="adminBannerImage" alt="Benefits banner" style="display:none;width:100%;height:auto;object-fit:cover"></div><h2 class="tTitle">Verified Tutors on CheQ</h2><div id="tList" class="tList"><div class="originalPage"><img class="originalList" src="./IMG-20261027-WA0009.jpg"><button class="rowHit" data-page="0" data-row="0" style="top:18%"></button><button class="rowHit" data-page="0" data-row="1" style="top:26.7%"></button><button class="rowHit" data-page="0" data-row="2" style="top:35.4%"></button><button class="rowHit" data-page="0" data-row="3" style="top:44.099999999999994%"></button><button class="rowHit" data-page="0" data-row="4" style="top:52.8%"></button><button class="rowHit" data-page="0" data-row="5" style="top:61.5%"></button><button class="rowHit" data-page="0" data-row="6" style="top:70.19999999999999%"></button><button class="rowHit" data-page="0" data-row="7" style="top:78.89999999999999%"></button><button class="rowHit" data-page="0" data-row="8" style="top:87.6%"></button></div><div class="originalPage"><img class="originalList" src="./IMG-20261027-WA0010.jpg"><button class="rowHit" data-page="1" data-row="0" style="top:18%"></button><button class="rowHit" data-page="1" data-row="1" style="top:26.7%"></button><button class="rowHit" data-page="1" data-row="2" style="top:35.4%"></button><button class="rowHit" data-page="1" data-row="3" style="top:44.099999999999994%"></button><button class="rowHit" data-page="1" data-row="4" style="top:52.8%"></button><button class="rowHit" data-page="1" data-row="5" style="top:61.5%"></button><button class="rowHit" data-page="1" data-row="6" style="top:70.19999999999999%"></button><button class="rowHit" data-page="1" data-row="7" style="top:78.89999999999999%"></button><button class="rowHit" data-page="1" data-row="8" style="top:87.6%"></button></div><div class="originalPage" 999999994%"></button><button class="rowHit" data-page="4" data-row="4" style="top:52.8%"></button><button class="rowHit" data-page="4" data-row="5" style="top:61.5%"></button><button class="rowHit" data-page="4" data-row="6" style="top:70.19999999999999%"></button><button class="rowHit" data-page="4" data-row="7" style="top:78.89999999999999%"></button><button class="rowHit" data-page="4" data-row="8" style="top:87.6%"></button></div><div class="originalPage"><img class="originalList" src="./IMG-20261027-WA0014.jpg"><button class="rowHit" data-page="5" data-row="0" style="top:18%"></button><button class="rowHit" data-page="5" data-row="1" style="top:26.7%"></button><button class="rowHit" data-page="5" data-row="2" style="top:35.4%"></button><button class="rowHit" data-page="5" data-row="3" style="top:44.099999999999994%"></button><button class="rowHit" data-page="5" data-row="4" style="top:52.8%"></button><button class="rowHit" data-page="5" data-row="5" style="top:61.5%"></button><button class="rowHit" data-page="5" data-row="6" style="top:70.19999999999999%"></button><button class="rowHit" data-page="5" data-row="7" style="top:78.89999999999999%"></button><button class="rowHit" data-page="5" data-row="8" style="top:87.6%"></button></div></div></div></main><div id="tDim" class="dim"></div><section id="tSheet" class="sheet"><button id="tClose" class="sheetClose">×</button><h2>Tutor Details</h2><div id="tDetail"></div><button class="proceed">Proceed</button></section><script>const tutors=[];const list=document.getElementById("tList");document.querySelectorAll(".rowHit").forEach((b)=>b.onclick=()=>{document.getElementById("tDetail").innerHTML='<div class="detailLine"><b>Selected Tutor</b> <span class="verified"></span></div><div class="detailLine">Details as shown in the selected row</div>';document.getElementById("tDim").classList.add("show");document.getElementById("tSheet").classList.add("show")});const tDim=document.getElementById("tDim"),tSheet=document.getElementById("tSheet"),tDetail=document.getElementById("tDetail");function openTutor(t){tDetail.innerHTML='<div class="detailLine"><b>'+t[0]+'</b> <span class="verified"></span></div><div class="detailLine">'+t[1]+': '+t[2]+'</div><div class="detailLine">Mobile: +91 '+t[3]+'</div><div class="detailLine">PAN Details: ••••••••••</div><div class="detailLine">IFSC: •••••••••••</div>';tDim.classList.add("show");tSheet.classList.add("show")}function closeTutor(){tDim.classList.remove("show");tSheet.classList.remove("show")}tDim.onclick=closeTutor;document.getElementById("tClose").onclick=closeTutor;document.getElementById("backBtn").onclick=()=>history.back();const m=document.getElementById("mobile");m.oninput=()=>{m.value=m.value.replace(/\D/g,"").slice(0,10)};document.getElementById("contactReal").onclick=async()=>{try{if(navigator.contacts&&navigator.contacts.select){const a=await navigator.contacts.select(["tel"],{multiple:false});if(a&&a[0]&&a[0].tel&&a[0].tel[0])m.value=a[0].tel[0].replace(/\D/g,"").slice(-10);else m.focus()}else m.focus()}catch(e){m.focus()}};const adminBanner=localStorage.getItem("cheq_tuition_banner");if(adminBanner){document.getElementById("adminBannerFallback").style.display="none";document.querySelector("#adminBannerSlot .benefitHead").style.display="none";const bi=document.getElementById("adminBannerImage");bi.src=adminBanner;bi.style.display="block";}</script></body></html>
