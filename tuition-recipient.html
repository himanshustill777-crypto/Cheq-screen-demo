-WA0014.jpg" alt=""><a class="back" href="./home-preview.html" aria-label="Back"></a><button id="listHit" class="hit" aria-label="Select beneficiary"></button><div id="dim" class="dim"></div><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2>Tutor Details</h2><div class="detail"><div><span class="name">Selected Tutor</span><span class="verified">✓ Verified</span></div><div class="sub">Bank / UPI &nbsp; • &nbsp; +91 ******100</div><div class="label">PAN Details</div><div class="value">AAN****M</div><div class="cols"><div><div class="label">Account / UPI</div><div class="value">**********0680</div></div><div><div class="label">IFSC Code</div><div class="value">PUNB0076910</div></div></div></div><button class="proceed" type="button">Proceed</button></section><script>const hit=document.getElementById("listHit"),dim=document.getElementById("dim"),sheet=document.getElementById("sheet"),close=document.getElementById("close");function openSheet(){dim.classList.add("on");sheet.classList.add("on")}function closeSheet(){dim.classList.remove("on");sheet.classList.remove("on")}hit.onclick=openSheet;dim.onclick=closeSheet;close.onclick=closeSheet;</script></main></body></html>
