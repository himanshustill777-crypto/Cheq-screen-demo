<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Recipient</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:Arial,sans-serif;color:#171717}body{display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;padding:18px 18px 175px;position:relative}.top{height:62px;display:flex;align-items:center}.back{border:0;background:#fff;font-size:30px;padding:0;width:34px;text-align:left}.help{margin-left:auto;width:28px;height:28px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px}.title{font-size:25px;font-weight:700;margin:28px 0 26px}.mobileWrap{display:flex;align-items:flex-end;gap:10px}.mobileField{flex:1;position:relative}.floatingLabel{position:absolute;top:-9px;left:14px;background:#fff;padding:0 5px;color:#aaa;font-size:14px}.input{width:100%;height:54px;border:1.5px solid #ddd;border-radius:9px;padding:0 14px;font-size:16px;outline:none;background:#fff}.mobile{font-weight:600}.contact{width:54px;height:54px;border:0;border-radius:9px;background:#28bf76;color:#fff;font-size:27px}.notice{font-size:16px;color:#aaa;font-weight:600;margin:22px 0 38px}.field{margin-bottom:38px}.field .input{height:54px}.account{height:54px;border:1.5px solid #ddd;border-radius:9px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:16px;color:#aaa}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,430px);background:#fff;border-top:1px solid #eee;padding:16px 18px 24px}.notify{font-size:14px;color:#aaa;line-height:1.45;margin:0 0 14px}.pay{width:100%;height:54px;border:0;border-radius:28px;background:#f0f1f1;color:#d0d0d0;font-size:18px;font-weight:700}.pay.on{background:#28bf76;color:#fff}
</style></head><body><main class="app">
<div class="top"><button class="back" onclick="history.back()">←</button><div class="help">?</div></div>
<h1 class="title">Enter Recipient Details</h1>
<div class="mobileWrap"><div class="mobileField"><span class="floatingLabel">Recipient's Mobile Number</span><input id="mobile" class="input mobile" readonly></div><button class="contact">♙</button></div>
<div class="notice">New recipient at CheQ. Add more details</div>
<div class="field"><input id="name" class="input" placeholder="Recipient's Name"></div>
<div class="field"><input id="pan" class="input" placeholder="PAN Details" maxlength="10"></div>
<div class="field"><div class="account"><span>Account Type</span><span>⌄</span></div></div>
</main>
<div class="bottom"><p class="notify">We will notify the recipient via WhatsApp/SMS to onboard<br>and start receiving payments via CheQ</p><button id="pay" class="pay">Pay Now</button></div>
<script>document.getElementById("mobile").value=sessionStorage.getItem("tuitionRecipientMobile")||"";</script></body></html>
