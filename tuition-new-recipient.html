<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Recipient</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#171717;display:flex;justify-content:center}.app{width:min(100vw,430px);min-height:100vh;padding:18px}.top{height:58px;display:flex;align-items:center}.back{border:0;background:#fff;font-size:28px;padding:0}.title{font-size:25px;font-weight:700;margin:26px 0 25px}.notice{font-size:16px;font-weight:600;margin-bottom:18px}.field{margin-bottom:18px}.label{font-size:13px;color:#777;margin:0 0 7px}.input{width:100%;height:54px;border:1.5px solid #ddd;border-radius:9px;padding:0 14px;font-size:16px;outline:none;background:#fff}.mobile{background:#f7f7f7;color:#555}.account{height:54px;border:1.5px solid #ddd;border-radius:9px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:16px}.pay{width:100%;height:54px;border:0;border-radius:28px;background:#d8d8d8;color:#fff;font-size:18px;font-weight:700;margin-top:18px}.pay.on{background:#28bf76}</style></head><body><main class="app"><div class="top"><button class="back" onclick="history.back()">←</button></div><h1 class="title">Enter Recipient Details</h1><div class="notice">New recipient at CheQ. Add more details</div><div class="field"><div class="label">Recipient's Mobile Number</div><input id="mobile" class="input mobile" readonly></div><div class="field"><div class="label">Recipient's Name</div><input id="name" class="input" placeholder="Enter recipient's name"></div><div class="field"><div class="label">PAN Details</div><input id="pan" class="input" placeholder="Enter PAN details" maxlength="10"></div><div class="field"><div class="label">Account Type</div><div class="account" onclick="alert('UPI ID / Bank Details')"><span>Select account type</span><span>›</span></div></div><button id="pay" class="pay">Pay Now</button></main><script>document.getElementById("mobile").value=sessionStorage.getItem("tuitionRecipientMobile")||"";</script></body></html>
