<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CheQ Home</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff}body{display:flex;justify-content:center}.app{width:min(100vw,430px);height:100vh;position:relative;overflow:hidden;background:#fff}.first{position:relative}.addcard{position:absolute;z-index:20;left:4.3%;right:4.3%;top:40.7%;height:7%;display:block}.tuitionHit{position:absolute;z-index:20;left:4.3%;width:56%;top:52.7%;height:13%;display:block}.shade{display:none;position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:50}.sheet{display:none;position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:18px 18px 0 0;padding:24px 18px 22px;font-family:Arial,sans-serif}.sheet h2{margin:8px 0 4px;font-size:24px}.sub{color:#888;font-size:16px;margin-bottom:28px}.close{position:absolute;right:18px;top:13px;border:0;background:none;font-size:36px;font-weight:200;color:#666}.amountWrap{position:relative;border:1.5px solid #ddd;border-radius:12px;height:142px;display:flex;align-items:center;justify-content:center}.amountWrap.bad{border-color:#d9534f}.pill{position:absolute;top:-19px;background:#fff;border:1px solid #ddd;border-radius:24px;padding:8px 18px;font-weight:600}.rupee{font-size:42px;color:#bbb;margin-right:8px}.amt{width:155px;border:0;outline:0;font-size:42px;font-weight:700;background:transparent}.err{height:38px;text-align:center;color:#d9534f;font-weight:600;padding-top:12px}.benefit{background:#dff5fb;border-radius:8px;padding:12px;margin:8px 0 20px;font-size:16px}.cont{width:100%;height:54px;border:0;border-radius:28px;background:#f0f2f2;color:#c9cdcd;font-size:18px;font-weight:700}.cont.on{background:#2bc477;color:#fff}.savedcards{position:absolute;z-index:19;left:7%;right:7%;top:23.8%;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.savedcards::-webkit-scrollbar{display:none}.savedcard{position:relative;min-width:100%;height:154px;overflow:hidden;background:linear-gradient(135deg,#151719 0%,#303438 48%,#111315 100%);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:20px 20px 18px;font:600 14px Arial,sans-serif;box-shadow:0 12px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.16);transform:perspective(800px) rotateX(1.5deg);text-shadow:0 1px 1px rgba(0,0,0,.35)}.savedcard small{display:block;position:absolute;left:20px;right:20px;bottom:28px;font-size:19px;letter-spacing:2px;font-weight:600;color:#f5f5f5}.scroll{height:100%;overflow-y:auto;padding-bottom:92px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}.shot{display:block;width:100%;height:auto}.last{position:relative;width:100%;height:auto;aspect-ratio:720/805;overflow:hidden}.last img{position:absolute;left:0;top:0;width:100%;height:auto}.nav{position:absolute;left:0;right:0;bottom:0;height:92px;overflow:hidden;background:#fff;z-index:10}.nav img{position:absolute;width:100%;height:auto;left:0;top:calc(-970 / 720 * min(100vw,430px))}.savedcard:before{content:"";position:absolute;width:46px;height:34px;left:20px;top:52px;border-radius:7px;background:linear-gradient(135deg,#d8c27b,#f3e3a6 45%,#b89b4f);box-shadow:inset 0 0 0 1px rgba(70,55,15,.28)}.savedcard:after{content:"CREDIT CARD";position:absolute;right:20px;top:20px;font-size:11px;letter-spacing:1.7px;color:rgba(255,255,255,.78)}.savedcard .cardlabel{font-size:13px;letter-spacing:.7px;color:rgba(255,255,255,.82)}</style></head><body><main class="app"><div class="scroll"><div class="first"><img class="shot" src="./IMG_20261027_111452.jpg" alt=""><div id="savedcards" class="savedcards"></div><a class="addcard" href="./add-card.html" aria-label="Add New Card"></a><a id="tuitionHit" class="tuitionHit" href="#" aria-label="Tuition Fee"></a></div><img class="shot" src="./IMG_20261027_111531.jpg" alt=""><div class="last"><img src="./IMG_20261027_111607.jpg" alt=""></div></div><div id="shade" class="shade"></div><section id="sheet" class="sheet"><button id="close" class="close">×</button><h2>Enter amount</h2><div class="sub">Enter the amount for Tuition Fees payment</div><div id="amountWrap" class="amountWrap"><div class="pill">▣ &nbsp; Tuition Fee</div><span class="rupee">₹</span><input id="amt" class="amt" inputmode="numeric" pattern="[0-9]*" aria-label="Tuition Fee amount"></div><div id="err" class="err"></div><div id="benefit" class="benefit">⭐ &nbsp; Earn reward points on your card* <span style="float:right;color:#12add1">•••</span></div><button id="cont" class="cont" disabled>Continue</button></section><div class="nav"><img src="./IMG_20261027_111607.jpg" alt=""></div></main><script>const box=document.getElementById("savedcards");let cards=[];try{cards=JSON.parse(localStorage.getItem("cheq_cards")||"[]")}catch(e){}cards.forEach((card,i)=>{const el=document.createElement("div");el.className="savedcard";el.innerHTML="<span class=\"cardlabel\">Credit Card "+(i+1)+"</span><small>XXXX XXXX XXXX "+card.last4+"</small>";box.appendChild(el)});const tuitionHit=document.getElementById("tuitionHit"),shade=document.getElementById("shade"),sheet=document.getElementById("sheet"),close=document.getElementById("close"),amt=document.getElementById("amt"),wrap=document.getElementById("amountWrap"),err=document.getElementById("err"),cont=document.getElementById("cont");function openSheet(){shade.style.display="block";sheet.style.display="block"}function closeSheet(){shade.style.display="none";sheet.style.display="none";amt.blur();clearInterval(bannerTimer)}const banners=["✅ &nbsp; No additional bank surcharge*","⭐ &nbsp; Earn reward points on your card*","*Benefits apply for: &nbsp; 🔵 &nbsp; 🟠 &nbsp; ✔️ &nbsp; 🟥 &nbsp; 🟥"];let bi=0,bannerTimer=null;function rotateBanner(){benefit.innerHTML=banners[bi]+"<span style=\"float:right;color:#12add1\">•••</span>";bi=(bi+1)%banners.length}tuitionHit.onclick=e=>{e.preventDefault();openSheet();rotateBanner();clearInterval(bannerTimer);bannerTimer=setInterval(rotateBanner,2500)};close.onclick=closeSheet;shade.onclick=closeSheet;amt.addEventListener("input",()=>{amt.value=amt.value.replace(/\D/g,"");const v=Number(amt.value||0),has=amt.value.length>0,bad=has&&v<2000;wrap.classList.toggle("bad",bad);err.textContent=bad?"Minimum tuition fees payment allowed is ₹2,000":"";cont.disabled=v<2000;cont.classList.toggle("on",v>=2000)});</script></body></html>
